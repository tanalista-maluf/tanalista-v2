# Fluxo principal de ponta a ponta, no simulador de iOS com Expo Go.
# Pré-requisitos: ./e2e/setup-local.sh rodado, `npm run dev` na raiz do repo
# e `npx expo start` em mobile/.
# Com o build próprio (npx expo run:ios | run:android), nos dois sistemas:
#   maestro test -e APP_ID=app.tanalista \
#     -e APP_URL='exp+tanalista://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081' \
#     e2e/main-flow.yaml
# Com o Expo Go: APP_URL=exp://localhost:8081 e APP_ID=host.exp.Exponent (iOS)
# ou host.exp.exponent (Android).
# No Android, antes: adb reverse tcp:54321 tcp:54321 && adb reverse tcp:3000 tcp:3000
appId: ${APP_ID}
---
# Reinicia o Expo Go antes de abrir o projeto: campos e navegação começam do zero
- launchApp
- waitForAnimationToEnd
- openLink: ${APP_URL}
# Se o Expo Go ainda estava abrindo, o link se perde e fica a tela inicial dele
- runFlow:
    when:
      visible: "Enter URL"
    commands:
      - openLink: ${APP_URL}
# O menu de desenvolvedor abre sozinho na primeira execução: no Android com
# uma apresentação ("Continue"), no iOS já aberto. Ele aparece alguns segundos
# depois de o app carregar, então espera por ele ou pelo app antes de decidir.
- extendedWaitUntil:
    visible: "Continue|Fast refresh|Fast Refresh|Próximos eventos|Entrar na sua conta"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Fast refresh|Fast Refresh"
    commands:
      - swipe:
          start: "50%, 50%"
          end: "50%, 98%"
- extendedWaitUntil:
    visible: "Próximos eventos|Entrar na sua conta"
    timeout: 30000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# tira o botão flutuante do Expo Go de cima do cabeçalho
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "89%, 10%"
          end: "50%, 85%"
          duration: 800
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "90%, 7%"
          end: "50%, 85%"
          duration: 800
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Entrar na sua conta"
- takeScreenshot: 01-login
- tapOn:
    id: "email"
- inputText: "bruno@teste.local"
- tapOn:
    id: "password"
- inputText: "senha-errada"
- tapOn:
    id: "submit"
- assertVisible: "E-mail ou senha incorretos."
- takeScreenshot: 02-login-erro
# Reabre o app para os campos voltarem vazios, em vez de apagar o texto
- launchApp
- waitForAnimationToEnd
